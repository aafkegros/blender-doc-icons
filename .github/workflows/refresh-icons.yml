name: Refresh Blender icons

on:
  workflow_dispatch:
    inputs:
      blender_ref:
        description: 'Blender tag or commit to import (for example v4.5.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-blender-icons
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check out Blender SVG sources
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: ${{ inputs.blender_ref }}
          path: .upstream/blender
          fetch-depth: 1
          sparse-checkout: |
            release/datafiles/icons_svg
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare icons and record the actual upstream commit
        id: prepare
        env:
          PYTHONPATH: src
        run: |
          python tools/import_blender.py .upstream/blender
          echo "revision=$(git -C .upstream/blender rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build distributions containing the refreshed assets
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      # PRs made with GITHUB_TOKEN do not trigger the usual PR workflows.
      - name: Check the refreshed package and example sites
        run: |
          python -m pip install '.[dev]'
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m unittest discover -s tests
          mkdocs build --strict -f examples/mkdocs/mkdocs.yml
          sphinx-build -q -W -b html examples/sphinx /tmp/blender-icons-html
          sphinx-build -q -W -b text examples/sphinx /tmp/blender-icons-text
      - name: Upload reviewable assets and distributions
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-blender-icons
          path: |
            src/blender_doc_icons/assets/icons/
            src/blender_doc_icons/assets/manifest.json
            dist/
          if-no-files-found: error
      - name: Open or update the icon refresh pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: codex/refresh-blender-icons
          base: ${{ github.event.repository.default_branch }}
          add-paths: |
            src/blender_doc_icons/assets/icons/
            src/blender_doc_icons/assets/manifest.json
          commit-message: Refresh Blender icons from ${{ steps.prepare.outputs.revision }}
          title: Refresh Blender documentation icons
          body: |
            Refresh the bundled icons from Blender commit `${{ steps.prepare.outputs.revision }}`.

            The importer normalizes SVG colours to `currentColor`, removes fixed dimensions
            and editor metadata, preserves viewBoxes, and removes obsolete icons.
            The manifest records the upstream commit and original and processed file hashes.

            Validation: built and checked distributions, ran regression tests, and built
            the MkDocs and Sphinx HTML/text examples against the refreshed wheel.

            Review icon changes and any upstream licence/attribution changes before merging.
            [Workflow run and downloadable artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
